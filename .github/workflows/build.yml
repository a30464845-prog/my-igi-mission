name: Build IGI 1 Mission

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download igi1conv
        run: |
          curl -L -o igi1conv https://github.com/heaven-hm/project-igi-converter/releases/latest/download/igi1conv-linux
          chmod +x igi1conv

      - name: Compile QSC to QVM
        run: |
          mkdir -p dist
          ./igi1conv qsc compile MISSION.qsc -o dist/MISSION.qvm
          ./igi1conv qsc compile OBJECTS.qsc -o dist/OBJECTS.qvm

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: igi-mission-qvm
          path: dist/   
