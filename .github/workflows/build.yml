name: Build IGI 1 Mission

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build igi1conv
        run: |
          git clone --depth 1 https://github.com/heaven-hm/project-igi-converter.git
          cd project-igi-converter
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Compile QSC to QVM
        run: |
          mkdir dist
          $exe = Get-ChildItem -Path .\project-igi-converter\build -Recurse -Filter "igi1conv.exe" | Select-Object -First 1
          Copy-Item $exe.FullName .\igi1conv.exe
          .\igi1conv.exe qsc compile MISSION.qsc -o dist\MISSION.qvm
          .\igi1conv.exe qsc compile OBJECTS.qsc -o dist\OBJECTS.qvm

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: igi-mission-qvm
          path: dist/   
